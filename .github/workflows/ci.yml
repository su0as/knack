name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6 libgl1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Environment check
        run: python -m knack check
      - name: Unit + integration tests (no network, no tokens)
        run: pytest -q --durations=15
      - name: Reference fixtures on 10 layouts per scene
        if: always()
        run: python -m knack oracle all --n 10 --frames --out ci-out/oracle
      - name: Offline mock run (plumbing only, canned coder)
        if: always()
        run: python -m knack learn lift --mock --rounds 2 --n 4 --eval 8 --runs ci-out/runs --budget 5
      - name: Demo GIF from a reference fixture
        if: always()
        run: |
          python -c "from knack.oracles import ORACLES; open('ci-out/stack_fixture.py','w').write(ORACLES['stack'])"
          python -m knack replay ci-out/stack_fixture.py --task stack --n 4 --cols 2 --out ci-out/stack_grid.gif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out
          path: |
            ci-out/oracle/*/ep_*/end_*.jpg
            ci-out/oracle/*/ep_*/start_front.jpg
            ci-out/runs/**/card.html
            ci-out/runs/**/card.md
            ci-out/runs/**/state.json
            ci-out/*.gif
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q --durations=10
