name: video
on:
  workflow_dispatch:
    inputs:
      stage:
        description: footage | render
        required: true
        default: footage
      console_run:
        description: run id holding the console artifact (defaults to footage_run)
        required: false
        default: ""
      footage_run:
        description: run id of a footage stage (for render)
        required: false
        default: ""
      ref:
        description: branch holding docs/video
        required: false
        default: main
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: inputs.stage == 'footage' || inputs.stage == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6 libgl1
      - run: pip install -q -e .
      - run: python docs/video/footage.py footage
      - uses: actions/upload-artifact@v4
        with: { name: replay, path: footage, retention-days: 7 }
  console:
    if: inputs.stage == 'footage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6 libgl1
      - run: pip install -q -e . playwright && python -m playwright install --with-deps chromium
      - run: python docs/video/capture_console.py console
      - run: tar -czf console_run.tgz runs
      - uses: actions/upload-artifact@v4
        with: { name: console, path: "console\nconsole_run.tgz", retention-days: 7 }
  render:
    if: inputs.stage == 'render'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-jetbrains-mono || sudo apt-get install -y -qq ffmpeg
      - run: pip install -q playwright numpy pillow && python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: replay, path: docs/video/build/replay, run-id: "${{ inputs.footage_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: console, path: docs/video/build/console_art, run-id: "${{ inputs.console_run || inputs.footage_run }}", github-token: "${{ github.token }}" }
      - run: python docs/video/render.py
      - uses: actions/upload-artifact@v4
        with: { name: video, path: "docs/video/build/knack_nebius.mp4\ndocs/video/build/stills", retention-days: 7 }
