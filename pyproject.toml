[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knack"
version = "0.1.0"
description = "Robots that learn new skills by practising in simulation. Zero demonstrations. NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suhas Suren" }]
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.24",
  "pillow>=10.0",
  "openai>=1.40",
  "opencv-python-headless>=5.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
mcp = ["mcp>=1.2"]
nebius = ["boto3>=1.34"]
real = ["lerobot"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[project.scripts]
knack = "knack.cli:main"

[project.urls]
Homepage = "https://github.com/su0as/knack"

[tool.setuptools.packages.find]
include = ["knack*"]

[tool.setuptools.package-data]
knack = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
